<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Avenir Next','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a2f"/>
      <stop offset="1" stop-color="#2b1a33"/>
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a3d"/>
      <stop offset="1" stop-color="#3d1a2e"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="640" fill="#160a14"/>
  <text x="600" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#fdf3f6" letter-spacing="6">TWO HALVES OF THE MAP</text>
  <text x="600" y="96" text-anchor="middle" font-size="16" fill="#c9a9bb">The same crossroads — rendered as two realities. You only continue where you agree.</text>

  <!-- GARDEN SIDE (player A) -->
  <g>
    <rect x="60" y="130" width="520" height="400" rx="22" fill="url(#garden)" stroke="#7bf1c3" stroke-opacity="0.4"/>
    <text x="320" y="166" text-anchor="middle" font-size="15" letter-spacing="4" fill="#7bf1c3">WHAT ALEX SEES · THE GARDEN</text>
    <!-- ground path -->
    <path d="M320 520 L300 440 Q320 400 320 360 L320 300" stroke="#7bf1c3" stroke-opacity="0.5" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 18"/>
    <path d="M320 360 Q250 320 210 270" stroke="#7bf1c3" stroke-opacity="0.4" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 16"/>
    <path d="M320 360 Q390 320 430 270" stroke="#7bf1c3" stroke-opacity="0.4" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 16"/>
    <!-- you marker -->
    <text x="320" y="540" font-size="42" text-anchor="middle">🚶</text>
    <text x="320" y="470" font-size="13" text-anchor="middle" fill="#7bf1c3">you are here</text>
    <!-- forks -->
    <circle cx="210" cy="250" r="40" fill="url(#doorGlow)"/>
    <text x="210" y="262" font-size="40" text-anchor="middle">🌻</text>
    <text x="210" y="222" font-size="13" text-anchor="middle" fill="#ffd166">the sunflowers</text>
    <text x="430" y="262" font-size="40" text-anchor="middle">🌉</text>
    <text x="430" y="222" font-size="13" text-anchor="middle" fill="#c9a9bb">the old bridge</text>
    <!-- flora -->
    <text x="110" y="500" font-size="34">🌷</text><text x="160" y="515" font-size="26">🌿</text>
    <text x="500" y="505" font-size="34">🌳</text><text x="460" y="518" font-size="24">🍄</text>
  </g>

  <!-- MACHINE SIDE (player B) -->
  <g>
    <rect x="620" y="130" width="520" height="400" rx="22" fill="url(#machine)" stroke="#b78cff" stroke-opacity="0.4"/>
    <text x="880" y="166" text-anchor="middle" font-size="15" letter-spacing="4" fill="#b78cff">WHAT SAM SEES · THE MACHINE</text>
    <path d="M880 520 L860 440 Q880 400 880 360 L880 300" stroke="#b78cff" stroke-opacity="0.5" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 18"/>
    <path d="M880 360 Q810 320 770 270" stroke="#b78cff" stroke-opacity="0.4" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 16"/>
    <path d="M880 360 Q950 320 990 270" stroke="#b78cff" stroke-opacity="0.4" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 16"/>
    <text x="880" y="540" font-size="42" text-anchor="middle">🚶</text>
    <text x="880" y="470" font-size="13" text-anchor="middle" fill="#b78cff">you are here</text>
    <circle cx="770" cy="250" r="40" fill="url(#doorGlow)"/>
    <text x="770" y="262" font-size="40" text-anchor="middle">⚙️</text>
    <text x="770" y="222" font-size="13" text-anchor="middle" fill="#ffd166">the brass engine</text>
    <text x="990" y="262" font-size="40" text-anchor="middle">🕰️</text>
    <text x="990" y="222" font-size="13" text-anchor="middle" fill="#c9a9bb">the clock tower</text>
    <text x="670" y="500" font-size="34">🔩</text><text x="720" y="515" font-size="26">🛢️</text>
    <text x="1060" y="505" font-size="34">⛓️</text><text x="1020" y="518" font-size="24">🔧</text>
  </g>

  <!-- shared fork verdict -->
  <rect x="330" y="560" width="540" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ff9ebb" stroke-opacity="0.45"/>
  <text x="600" y="592" text-anchor="middle" font-size="17" fill="#ff9ebb">Both chose left — “the sunflowers” / “the brass engine”. Same heart, two worlds. 💞</text>
</svg>
