<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rev F — Programmable Food Chopper (Kinematic Sequence)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#10151d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#e8edf4}
  #app{position:fixed;inset:0}
  #hud{position:fixed;left:0;top:0;padding:14px 18px;pointer-events:none;max-width:46%}
  #hud h1{font-size:1rem;margin:0;font-weight:700}
  .tag{font-size:.6rem;background:#ff8c2f;color:#10151d;padding:2px 7px;border-radius:999px;vertical-align:middle;margin-left:8px;font-weight:800}
  #step-label{margin-top:6px;font-size:.95rem;color:#ffd9ad;font-weight:600}
  #mech-line{font-size:.78rem;color:#8fa0b8;margin-top:2px}
  #legend{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;font-size:.66rem;color:#9fb0c8}
  #legend span{display:flex;align-items:center;gap:4px}
  #legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  #panel{position:fixed;right:0;top:0;bottom:64px;width:292px;overflow-y:auto;background:rgba(13,18,26,.82);backdrop-filter:blur(8px);padding:12px 14px;font-size:.78rem}
  .sec{margin-bottom:14px;border-bottom:1px solid #232c3a;padding-bottom:10px}
  .sec-h{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:#7c8da5;margin-bottom:6px}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button{background:#223047;border:1px solid #31405a;color:#dbe5f2;font-size:.72rem;padding:6px 10px;border-radius:7px;cursor:pointer}
  button:hover{background:#2c3d5c}
  button.on{background:#ff8c2f;color:#10151d;font-weight:700;border-color:#ff8c2f}
  #mech-name{font-weight:700;color:#ffd9ad}
  #mech-detail{color:#9fb0c8;margin-top:4px;line-height:1.5}
  #map{display:flex;flex-wrap:wrap;gap:4px}
  .chip{background:#223047;border:1px solid #31405a;border-radius:6px;padding:3px 6px;font-size:.64rem;color:#9fb0c8}
  .chip.live{background:#ff8c2f;color:#10151d;border-color:#ff8c2f;font-weight:800}
  #assert .ok{color:#57d99a}
  #assert .bad{color:#ff7b7b;font-weight:700}
  #assert.has-bad{background:rgba(255,60,60,.1);border:1px solid #7a2a2a;border-radius:6px;padding:6px}
  .warn{border:1px solid #5a4a1f;background:rgba(255,176,32,.06);border-radius:8px;padding:8px}
  .warn ul{margin:4px 0 0;padding-left:16px;color:#e8c98a;line-height:1.5}
  #bar{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;gap:8px;align-items:center;padding:0 14px;background:rgba(10,14,20,.85);backdrop-filter:blur(6px)}
  #play{background:#ff8c2f;color:#10151d;font-weight:800;border:none;padding:8px 14px;border-radius:999px}
  #scrub{flex:1;accent-color:#ff8c2f}
  #tcode{font-variant-numeric:tabular-nums;font-size:.74rem;color:#9fb0c8;min-width:90px;text-align:right}
  #track{position:fixed;left:0;right:0;bottom:52px;height:16px;background:#0c1119}
  .ph{position:absolute;top:0;bottom:0;border-right:1px solid #0c1119;background:#22304a}
  .ph.now{background:#ff8c2f}
  #count-line{margin-top:6px;color:#9fb0c8}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.bundle.js"></script>
</body>
</html>
